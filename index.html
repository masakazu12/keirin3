    <script>
      // Intercept and suppress external browser extension errors (e.g. MetaMask inpage.js in sandboxed iframe)
      window.addEventListener('error', function(event) {
        var source = (event && event.filename) || '';
        var msg = (event && event.message) || '';
        if (
          source.indexOf('chrome-extension://') !== -1 ||
          msg.indexOf('MetaMask') !== -1 ||
          msg.indexOf('ethereum') !== -1
        ) {
          event.stopImmediatePropagation();
          event.preventDefault();
          return true;
        }
      }, true);

      window.addEventListener('unhandledrejection', function(event) {
        var reason = event && event.reason;
        var reasonText = (reason && (reason.message || reason.stack || String(reason))) || '';
        if (
          reasonText.indexOf('chrome-extension://') !== -1 ||
          reasonText.indexOf('MetaMask') !== -1 ||
          reasonText.indexOf('ethereum') !== -1
        ) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
    </script>
